<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pencarian Profil GitHub</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
    padding: 48px 16px; background: #0d1117; color: #e6edf3;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .container { width: 100%; max-width: 440px; }
  h1 { font-size: 1.5rem; text-align: center; margin: 0 0 20px; }
  form { display: flex; gap: 8px; }
  input {
    flex: 1; padding: 12px 14px; border-radius: 8px; border: 1px solid #30363d;
    background: #161b22; color: inherit; font-size: 1rem;
  }
  input:focus { outline: 2px solid #2f81f7; border-color: transparent; }
  button {
    padding: 12px 18px; border: 0; border-radius: 8px; background: #238636; color: #fff;
    font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #2ea043; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  #result { margin-top: 24px; }
  .card, .message {
    background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; text-align: center;
  }
  .message.error { border-color: #f85149; color: #ff7b72; }
  .spinner {
    width: 32px; height: 32px; margin: 0 auto 12px; border: 4px solid #30363d;
    border-top-color: #2f81f7; border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .avatar { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #30363d; }
  .card h2 { margin: 14px 0 2px; font-size: 1.3rem; }
  .username { color: #8b949e; margin: 0 0 12px; }
  .bio { margin: 0 0 16px; line-height: 1.5; }
  .bio.empty { color: #8b949e; font-style: italic; }
  .repos { display: inline-block; padding: 6px 14px; border-radius: 999px; background: #21262d; margin-bottom: 18px; }
  .link {
    display: block; padding: 10px; border-radius: 8px; background: #1f6feb; color: #fff;
    text-decoration: none; font-weight: 600;
  }
  .link:hover { background: #388bfd; }
</style>
</head>
<body>
  <main class="container">
    <h1>Cari Profil GitHub</h1>
    <form id="search-form">
      <input id="username" type="text" placeholder="Masukkan username GitHub" autocomplete="off" required>
      <button id="submit-btn" type="submit">Cari</button>
    </form>
    <div id="result" aria-live="polite"></div>
  </main>

<script>
  const form = document.getElementById('search-form');
  const input = document.getElementById('username');
  const btn = document.getElementById('submit-btn');
  const result = document.getElementById('result');

  function showMessage(text, isError) {
    result.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'message' + (isError ? ' error' : '');
    div.textContent = text;
    result.appendChild(div);
  }

  function showLoading() {
    result.innerHTML = '<div class="message"><div class="spinner"></div>Memuat data...</div>';
  }

  function showProfile(user) {
    result.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('img');
    img.className = 'avatar';
    img.src = user.avatar_url;
    img.alt = 'Avatar ' + user.login;

    const name = document.createElement('h2');
    name.textContent = user.name || user.login;

    const login = document.createElement('p');
    login.className = 'username';
    login.textContent = '@' + user.login;

    const bio = document.createElement('p');
    bio.className = 'bio' + (user.bio ? '' : ' empty');
    bio.textContent = user.bio || 'Tidak ada bio.';

    const repos = document.createElement('div');
    repos.className = 'repos';
    repos.textContent = 'Repositori publik: ' + user.public_repos;

    const link = document.createElement('a');
    link.className = 'link';
    link.href = user.html_url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = 'Kunjungi Profil GitHub';

    card.append(img, name, login, bio, repos, link);
    result.appendChild(card);
  }

  async function searchUser(username) {
    showLoading();
    btn.disabled = true;
    try {
      const res = await fetch('https://api.github.com/users/' + encodeURIComponent(username));
      if (res.status === 404) {
        showMessage('User tidak ditemukan', true);
      } else if (res.status === 403) {
        showMessage('Batas request API GitHub tercapai. Coba lagi nanti.', true);
      } else if (!res.ok) {
        showMessage('Terjadi kesalahan (status ' + res.status + ').', true);
      } else {
        showProfile(await res.json());
      }
    } catch (err) {
      showMessage('Gagal terhubung. Periksa koneksi internet Anda.', true);
    } finally {
      btn.disabled = false;
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const username = input.value.trim();
    if (username) searchUser(username);
  });
</script>
</body>
</html>
